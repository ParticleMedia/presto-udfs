name: Build Presto UDFs

on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: 'JDK version to use for build'
        required: true
        default: '24'
        type: choice
        options:
          - '21'
          - '24'
          - '25'

jobs:
  build:
    runs-on: checks
    container:
      image: public.ecr.aws/docker/library/maven:3.9.12-eclipse-temurin-${{ inputs.jdk_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display Build Configuration
        run: |
          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **JDK Version:** ${{ inputs.jdk_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Maven Version:** 3.9.12" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Fix file permissions
        run: |
          chmod -R 777 .
          chown -R 1000:1000 .
          echo "Checking file permissions after fix:"
          ls -la .

      - name: Build with Maven
        run: |
          echo "Building with JDK ${{ inputs.jdk_version }}..."
          mvn package -Dmaven.compiler.source=${{ inputs.jdk_version }} -Dmaven.compiler.target=${{ inputs.jdk_version }}
          cd target
          tar -czf udfs-3.0.1-SNAPSHOT.tar.gz udfs-3.0.1-SNAPSHOT/
          tar -cf udfs-3.0.1-SNAPSHOT.tar udfs-3.0.1-SNAPSHOT/

      - name: Upload ZIP artifact
        id: upload-zip
        uses: actions/upload-artifact@v4
        with:
          name: udfs-3.0.1-SNAPSHOT-zip
          path: target/udfs-3.0.1-SNAPSHOT.zip

      - name: Upload TAR.GZ artifact
        id: upload-tar-gz
        uses: actions/upload-artifact@v4
        with:
          name: udfs-3.0.1-SNAPSHOT-tar-gz
          path: target/udfs-3.0.1-SNAPSHOT.tar.gz

      - name: Upload TAR artifact
        id: upload-tar
        uses: actions/upload-artifact@v4
        with:
          name: udfs-3.0.1-SNAPSHOT-tar
          path: target/udfs-3.0.1-SNAPSHOT.tar

      - name: Output all artifact IDs and run ID to summary
        run: |
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "ZIP Artifact ID is ${{ steps.upload-zip.outputs.artifact-id }}" >> $GITHUB_STEP_SUMMARY
          echo "TAR.GZ Artifact ID is ${{ steps.upload-tar-gz.outputs.artifact-id }}" >> $GITHUB_STEP_SUMMARY
          echo "TAR Artifact ID is ${{ steps.upload-tar.outputs.artifact-id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build completed successfully with JDK ${{ inputs.jdk_version }}**" >> $GITHUB_STEP_SUMMARY
