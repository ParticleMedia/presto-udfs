name: Build Presto UDFs

on:
  workflow_dispatch:
    inputs:
      maven_image:
        description: 'Maven + JDK Docker image to use for build'
        required: true
        default: '3.9-eclipse-temurin-24'
        type: choice
        options:
          - '3.9-eclipse-temurin-21'
          - '3.9-eclipse-temurin-22'
          - '3.9-eclipse-temurin-23'
          - '3.9-eclipse-temurin-24'
          - '3.9-eclipse-temurin-25'

jobs:
  build:
    runs-on: checks
    container:
      image: public.ecr.aws/docker/library/maven:${{ inputs.maven_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display Build Configuration
        run: |
          JDK_VERSION=$(echo "${{ inputs.maven_image }}" | grep -oP '\d+$')
          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image:** maven:${{ inputs.maven_image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **JDK Version:** ${JDK_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Maven Version:** 3.9" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Fix file permissions
        run: |
          chmod -R 777 .
          chown -R 1000:1000 .
          echo "Checking file permissions after fix:"
          ls -la .

      - name: Build with Maven
        run: |
          JDK_VERSION=$(echo "${{ inputs.maven_image }}" | grep -oP '\d+$')
          echo "Building with Maven image: ${{ inputs.maven_image }} (JDK ${JDK_VERSION})..."
          mvn package -Dmaven.compiler.source=${JDK_VERSION} -Dmaven.compiler.target=${JDK_VERSION}
          cd target
          tar -czf udfs-3.0.1-SNAPSHOT.tar.gz udfs-3.0.1-SNAPSHOT/
          tar -cf udfs-3.0.1-SNAPSHOT.tar udfs-3.0.1-SNAPSHOT/

      - name: Upload ZIP artifact
        id: upload-zip
        uses: actions/upload-artifact@v4
        with:
          name: udfs-3.0.1-SNAPSHOT-zip
          path: target/udfs-3.0.1-SNAPSHOT.zip

      - name: Upload TAR.GZ artifact
        id: upload-tar-gz
        uses: actions/upload-artifact@v4
        with:
          name: udfs-3.0.1-SNAPSHOT-tar-gz
          path: target/udfs-3.0.1-SNAPSHOT.tar.gz

      - name: Upload TAR artifact
        id: upload-tar
        uses: actions/upload-artifact@v4
        with:
          name: udfs-3.0.1-SNAPSHOT-tar
          path: target/udfs-3.0.1-SNAPSHOT.tar

      - name: Output all artifact IDs and run ID to summary
        run: |
          JDK_VERSION=$(echo "${{ inputs.maven_image }}" | grep -oP '\d+$')
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "ZIP Artifact ID is ${{ steps.upload-zip.outputs.artifact-id }}" >> $GITHUB_STEP_SUMMARY
          echo "TAR.GZ Artifact ID is ${{ steps.upload-tar-gz.outputs.artifact-id }}" >> $GITHUB_STEP_SUMMARY
          echo "TAR Artifact ID is ${{ steps.upload-tar.outputs.artifact-id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build completed successfully with Maven ${{ inputs.maven_image }} (JDK ${JDK_VERSION})**" >> $GITHUB_STEP_SUMMARY
